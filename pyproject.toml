[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fjordlens"
version = "1.2.1"
description = "Evidence-first Norwegian company research agent for Builderr Signalpost"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []  # Runtime uses the Python standard library only.

[project.scripts]
fjordlens = "fjordlens.__main__:main"

[tool.setuptools]
packages = ["fjordlens"]

[tool.setuptools.package-data]
fjordlens = ["web/*", "data/*.json.gz"]

[tool.fjordlens]
strategy_version = "2026-10-20-v6"
default_wall_seconds = 2600
default_requests_per_company = 40
default_total_requests_per_company = 20
default_site_content_pages = 12
default_external_cost_usd = 0
